<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="devtools-guard.js"></script>
<title>Module 1: Introduction to Drug Discovery | Excelra</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  :root {
    --bg: #030508;
    --bg-soft: #080c14;
    --surface: rgba(12, 18, 28, 0.6);
    --surface-hover: rgba(20, 28, 40, 0.8);
    --accent: #00d4ff;
    --accent-soft: rgba(0, 212, 255, 0.15);
    --accent-glow: rgba(0, 212, 255, 0.4);
    --highlight: #7000ff;
    --highlight-glow: rgba(112, 0, 255, 0.4);
    --ink: #ffffff;
    --ink-soft: #a0b0c0;
    --muted: #5a6578;
    --border: rgba(0, 212, 255, 0.15);
    --border-strong: rgba(0, 212, 255, 0.4);
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; }
  body { cursor: default; }

  /* WebGL Canvas */
  #webgl-canvas { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    pointer-events: none;
  }
  
  /* Vignette and Grid Overlays */
  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at center, transparent 30%, rgba(3,5,8,0.8) 100%);
  }
  #hud-grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image: 
      linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px), 
      linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(circle at center, black 20%, transparent 70%);
  }

  /* Start Screen */
  #startScreen {
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(3, 5, 8, 0.85);
    backdrop-filter: blur(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    overflow-y:auto; padding:32px 20px;
  }
  #startScreen.hidden { opacity:0; transform:scale(1.05); pointer-events:none; }
  
  .start-badge {
    display:inline-flex; align-items:center; gap:10px; padding:8px 20px;
    border:1px solid var(--border-strong); border-radius:100px; font-size:12px;
    font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--accent);
    margin-bottom:40px; background:rgba(0, 212, 255, 0.05);
    box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
    font-family: 'JetBrains Mono', monospace;
  }
  .start-badge .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow: 0 0 10px var(--accent); animation:pulse-dot 2s infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.3;transform:scale(0.5)} }
  
  .start-module { font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:500; color:var(--muted); letter-spacing:6px; text-transform:uppercase; margin-bottom:16px; }
  .start-title { font-family:'Space Grotesk',sans-serif; font-size:clamp(40px,7vw,80px); font-weight:700; line-height:1.1; text-align:center; max-width:1000px; margin-bottom:24px; color:var(--ink); text-transform: uppercase; letter-spacing: -2px; }
  .start-title .accent { 
    background: linear-gradient(135deg, var(--accent) 0%, var(--highlight) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px var(--accent-glow));
  }
  .start-sub { font-size:18px; color:var(--ink-soft); max-width:600px; text-align:center; line-height:1.6; margin-bottom:56px; font-weight:400; }
  
  .start-btn {
    position:relative; display:inline-flex; align-items:center; gap:14px;
    padding:20px 50px; border:none; border-radius:4px; cursor:pointer;
    background: linear-gradient(135deg, var(--accent) 0%, var(--highlight) 100%);
    color:#fff; font-family:'Inter',sans-serif; font-size:14px; font-weight:700; letter-spacing:2px; text-transform: uppercase;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1); 
    box-shadow: 0 10px 40px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.3);
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  .start-btn:hover { transform:translateY(-2px); box-shadow: 0 15px 50px var(--highlight-glow), inset 0 1px 0 rgba(255,255,255,0.4); }
  .start-btn:active { transform:scale(0.98); }
  .start-btn i { font-size:12px; }
  
  .start-brand {
    position:static; margin-top:48px;
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:10px; color:var(--muted); font-size:12px; font-weight:500; text-align:center; font-family: 'JetBrains Mono', monospace;
  }

  /* Presentation Container */
  #presentation {
    position:fixed; inset:0; z-index:10; display:flex; align-items:center;
    padding:0 10vw; opacity:0; transition:opacity 0.5s ease; pointer-events:none;
  }
  #presentation.active { opacity:1; pointer-events:auto; }
  
  .slide-num {
    position:absolute; left:4vw; top:50%; transform:translateY(-50%);
    font-family:'Space Grotesk',sans-serif; font-size:clamp(120px,20vw,280px);
    font-weight:800; color:transparent; -webkit-text-stroke: 1px rgba(0, 212, 255, 0.05);
    line-height:1; pointer-events:none; transition: opacity 0.5s ease; user-select:none;
  }
  .slide-num.fade-out { opacity:0; transform:translateY(-50%) scale(0.9); }
  
  .slide-content { position:relative; z-index:1; margin-left:clamp(80px,12vw,180px); max-width:820px; width:100%; }
  
  /* Typography & Elements */
  .slide-label {
    display:inline-flex; align-items:center; gap:12px; font-size:11px; font-weight:600;
    letter-spacing:4px; text-transform:uppercase; color:var(--accent); margin-bottom:32px;
    font-family: 'JetBrains Mono', monospace;
    padding: 6px 12px; border: 1px solid var(--border); background: rgba(0, 212, 255, 0.05);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .slide-label .line { width:20px; height:1px; background:var(--accent); }
  
  .slide-title {
    font-family:'Space Grotesk',sans-serif; font-size:clamp(36px,4.5vw,56px);
    font-weight:700; line-height:1.1; margin-bottom:40px; color:var(--ink);
    text-transform: uppercase; letter-spacing: -1px;
  }
  .slide-title .hl { 
    background: linear-gradient(135deg, var(--accent) 0%, var(--highlight) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* Content Types - HUD Cards */
  .bullet {
    display:flex; gap:16px; margin-bottom:16px; 
    padding:20px 24px; border-radius:0; 
    border:1px solid var(--border);
    background:var(--surface); backdrop-filter: blur(12px);
    clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    position: relative;
  }
  .bullet::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: 0; transition: opacity 0.3s; }
  .bullet:hover::before { opacity: 1; }
  .bullet:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  
  .bullet-icon {
    flex-shrink:0; width:32px; height:32px; border-radius:0; background:rgba(0, 212, 255, 0.1);
    color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:14px;
    margin-top:2px; border: 1px solid var(--border);
  }
  .bullet-text { font-size:clamp(15px,1.4vw,17px); line-height:1.6; color:var(--ink-soft); font-weight:400; }
  .bullet-text .key { color:var(--accent); font-weight:600; }
  .bullet-text .em { color:var(--highlight); font-weight:600; filter: drop-shadow(0 0 5px var(--highlight-glow)); }

  /* Split Layout (Text + Diagram) */
  .split-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 80px; align-items: center; }
  .split-visual { 
    display: flex; justify-content: center; align-items: center;
    height: 400px; position: relative;
  }
  .visual-container { width: 100%; height: 100%; position: relative; }
  
  /* Corner brackets for visuals */
  .visual-container::before, .visual-container::after,
  .visual-container .br-bl, .visual-container .br-br {
    content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--accent); z-index: 2;
  }
  .visual-container::before { top: 0; left: 0; border-right: none; border-bottom: none; }
  .visual-container::after { top: 0; right: 0; border-left: none; border-bottom: none; }
  .visual-container .br-bl { bottom: 0; left: 0; border-right: none; border-top: none; position: absolute; }
  .visual-container .br-br { bottom: 0; right: 0; border-left: none; border-top: none; position: absolute; }

  /* Bento Box Summary */
  .bento-grid { 
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
    gap: 16px; margin-top: 4px; height: 450px;
  }
  .bento-card {
    padding: 28px; border: 1px solid var(--border);
    background: var(--surface); backdrop-filter: blur(12px);
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
    clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
  }
  .bento-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  
  .bento-card.large { grid-column: span 2; grid-row: span 2; background: linear-gradient(135deg, rgba(0,212,255,0.05) 0%, rgba(112,0,255,0.05) 100%); border-color: var(--border-strong); }
  .bento-card .sc-icon { font-size: 28px; color: var(--accent); margin-bottom: 16px; width: 56px; height: 56px; border-radius: 0; background: rgba(0, 212, 255, 0.1); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
  .bento-card .sc-text { font-size: 14px; line-height: 1.5; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; }
  .bento-card.large .sc-text { font-size: 20px; font-family: 'Inter', sans-serif; }
  .bento-card .sc-text .key { color: var(--accent); font-weight: 600; }

  /* Title & Closing */
  .title-slide .slide-content, .closing-slide .slide-content { margin-left:0; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .title-slide .slide-title { font-size:clamp(44px,6vw,72px); margin-bottom:24px; }
  .title-slide .slide-subtitle { font-size:clamp(16px,1.8vw,22px); color:var(--ink-soft); font-weight:400; margin-bottom:16px; font-family: 'JetBrains Mono', monospace; }
  .title-slide .slide-brand { font-size:12px; color:var(--accent); font-weight:600; letter-spacing:4px; text-transform:uppercase; font-family: 'JetBrains Mono', monospace; }
  .closing-slide .slide-content { margin-left:0; text-align:center; display:flex; flex-direction:column; align-items:center; }

  /* UI Chrome - Top Bar */
  .top-bar {
    position:fixed; top:0; left:0; right:0; z-index:20; display:flex;
    align-items:center; justify-content:space-between; padding:24px 40px;
    background:linear-gradient(180deg, rgba(3,5,8,0.9) 0%, transparent 100%);
    backdrop-filter: blur(5px); border-bottom: 1px solid var(--border);
    opacity:0; transition:opacity 0.5s ease;
  }
  .top-bar.visible { opacity:1; }
  .top-bar-left { display:flex; align-items:center; gap:16px; }
  .top-bar-logo { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; color:var(--ink); letter-spacing:1px; text-transform: uppercase; }
  .top-bar-logo span { background: linear-gradient(135deg, var(--accent) 0%, var(--highlight) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .top-bar-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse-dot 2s infinite; }
  
  .module-chip {
    padding:8px 16px; border:1px solid var(--border-strong); background:rgba(0, 212, 255, 0.05);
    font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--accent);
    font-family: 'JetBrains Mono', monospace; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  
  /* Bottom Bar Controls */
  .bottom-bar {
    position:fixed; bottom:0; left:0; right:0; z-index:20; padding:0 40px 32px;
    background:linear-gradient(0deg, rgba(3,5,8,0.95) 0%, transparent 100%);
    opacity:0; transition:opacity 0.5s ease;
  }
  .bottom-bar.visible { opacity:1; }
  
  .progress-track {
    width:100%; height:4px; background:rgba(255,255,255,0.05); 
    margin-bottom:24px; overflow:visible; cursor:pointer; position:relative;
    border-radius: 2px;
  }
  .progress-fill {
    height:100%; width:0%; border-radius:2px; 
    background:linear-gradient(90deg, var(--accent) 0%, var(--highlight) 100%);
    transition:width 0.4s ease; position:relative; box-shadow: 0 0 15px var(--accent-glow);
  }
  .progress-fill.scrubbing { transition:none; }
  .progress-fill::after {
    content:''; position:absolute; right:-8px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; border-radius:50%; background:#030508; border:2px solid var(--accent);
    box-shadow:0 0 12px var(--accent-glow);
  }
  
  .controls-row { display:flex; align-items:center; justify-content:space-between; }
  .controls-left, .controls-right { display:flex; align-items:center; gap:12px; }
  
  .ctrl-btn {
    width:44px; height:44px; border:none; border-radius:0; cursor:pointer;
    background:var(--surface); color:var(--ink-soft); font-size:14px;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.2s ease; border:1px solid var(--border); backdrop-filter: blur(5px);
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  }
  .ctrl-btn:hover { background:var(--surface-hover); border-color:var(--border-strong); color:var(--accent); }
  .ctrl-btn.active { color:var(--accent); background:rgba(0, 212, 255, 0.1); border-color:var(--border-strong); }
  .ctrl-btn.play-btn { width:56px; height:56px; font-size:18px; background: linear-gradient(135deg, var(--accent) 0%, var(--highlight) 100%); color:#fff; border-color:transparent; box-shadow: 0 4px 20px var(--accent-glow); }
  .ctrl-btn.play-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px var(--highlight-glow); }
  
  .audio-wave { display:flex; align-items:center; gap:3px; height:20px; margin-left:12px; }
  .audio-wave .bar { width:3px; border-radius:3px; background:var(--accent); animation:wave 0.8s ease-in-out infinite; box-shadow: 0 0 5px var(--accent-glow); }
  .audio-wave .bar:nth-child(1) { height:8px; animation-delay:0s; }
  .audio-wave .bar:nth-child(2) { height:14px; animation-delay:0.15s; }
  .audio-wave .bar:nth-child(3) { height:10px; animation-delay:0.3s; }
  .audio-wave .bar:nth-child(4) { height:16px; animation-delay:0.1s; }
  .audio-wave .bar:nth-child(5) { height:6px; animation-delay:0.25s; }
  .audio-wave.paused .bar { animation-play-state:paused; height:4px !important; }
  @keyframes wave { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }
  
  .slide-counter { font-family: 'JetBrains Mono', monospace; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:1px; font-variant-numeric:tabular-nums; }
  .slide-counter .current { color:var(--accent); font-size:16px; text-shadow: 0 0 10px var(--accent-glow); }
  
  .transition-overlay { position:fixed; inset:0; z-index:15; background:var(--bg); opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
  .transition-overlay.active { opacity:1; }

  #introVideo, #outroVideo {
    position:fixed; inset:0; z-index:10; width:100%; height:100%;
    object-fit:cover; background:#000; display:none;
  }

  /* Responsive */
  @media (max-width:1024px) {
    .split-layout { grid-template-columns: 1fr; gap: 40px; }
    .split-visual { order: -1; height: 250px; }
    .bento-grid { grid-template-columns: 1fr 1fr; height: auto; }
    .bento-card.large { grid-column: span 2; grid-row: span 1; }
  }
  @media (max-width:768px) {
    .slide-num { font-size:80px; left:2vw; }
    .slide-content { margin-left:clamp(50px,11vw,120px); }
    .bento-grid { grid-template-columns: 1fr; }
    .bento-card.large { grid-column: span 1; }
    .top-bar, .bottom-bar { padding-left:16px; padding-right:16px; }
    .bottom-bar { padding-bottom:16px; }
    .visual-container { display: none; }
  }
  @media (max-height:700px) {
    .start-badge { margin-bottom:16px; }
    .start-title { margin-bottom:10px; font-size:clamp(24px,5vw,40px); }
    .start-sub { margin-bottom:22px; }
    .start-brand { margin-top:16px; font-size:12px; }
  }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>
<div id="hud-grid"></div>
<div id="vignette"></div>

<div id="startScreen" role="dialog" aria-label="Start presentation">
  <div class="start-badge"><div class="dot"></div> SYSTEM INITIALIZED</div>
  <div class="start-module">Module 01</div>
  <h1 class="start-title">Introduction to <span class="accent">Drug Discovery</span></h1>
  <p class="start-sub">How structured data and AI are transforming the journey from molecule to medicine.</p>
  <button class="start-btn" id="startBtn" aria-label="Begin presentation"><i class="fas fa-play"></i> Initialize Sequence</button>
  <div class="start-brand">
    <span>BUILT BY</span>
    <span style="color:var(--ink);font-weight:700;">EXCELRA</span>
    <span style="color:var(--muted);">— WHERE DATA MEANS MORE</span>
  </div>
</div>

<div class="transition-overlay" id="transOverlay" aria-hidden="true"></div>

<video id="introVideo" src="Introduction.mp4" playsinline></video>
<video id="outroVideo" src="Outro.mp4" playsinline></video>

<header class="top-bar" id="topBar">
  <div class="top-bar-left">
    <div class="top-bar-logo">EXCEL<span>RA</span></div>
    <div class="top-bar-status"><div class="dot"></div> LIVE_SESSION_ACTIVE</div>
  </div>
  <div class="top-bar-right">
    <div class="module-chip">MODULE 01</div>
  </div>
</header>

<main id="presentation" aria-live="polite">
  <div class="slide-num" id="slideNum" aria-hidden="true">01</div>
  <div class="slide-content" id="slideContent"></div>
</main>

<footer class="bottom-bar" id="bottomBar">
  <div class="progress-track" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="controls-row">
    <div class="controls-left">
      <button class="ctrl-btn" id="btnRestart" title="Restart" aria-label="Restart"><i class="fas fa-rotate-left"></i></button>
      <button class="ctrl-btn" id="btnPrev" title="Previous section" aria-label="Previous section"><i class="fas fa-backward-step"></i></button>
      <button class="ctrl-btn play-btn" id="btnPlay" title="Play / Pause" aria-label="Play or Pause"><i class="fas fa-pause"></i></button>
      <button class="ctrl-btn" id="btnNext" title="Next section" aria-label="Next section"><i class="fas fa-forward-step"></i></button>
      <div class="audio-wave" id="audioWave">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>
    <div class="controls-right">
      <button class="ctrl-btn" id="btnMute" title="Mute / Unmute" aria-label="Mute or Unmute"><i class="fas fa-volume-high"></i></button>
      <button class="ctrl-btn" id="btnFullscreen" title="Full screen" aria-label="Toggle full screen"><i class="fas fa-expand"></i></button>
      <div class="slide-counter"><span class="current" id="counterCurrent">01</span> / <span id="counterTotal">01</span></div>
    </div>
  </div>
</footer>

<script src="voice-engine.js"></script>
<script>
// =========================================================
// THREE.JS BACKGROUND ENGINE
// =========================================================
let scene, camera, renderer, moleculeGroup, particleSystem;
let current3DTheme = 'molecule';

function initThreeJS() {
  const canvas = document.getElementById('webgl-canvas');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 30;

  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x404040, 2);
  scene.add(ambientLight);
  const pointLight1 = new THREE.PointLight(0x00d4ff, 2, 100);
  pointLight1.position.set(20, 20, 20);
  scene.add(pointLight1);
  const pointLight2 = new THREE.PointLight(0x7000ff, 2, 100);
  pointLight2.position.set(-20, -20, 10);
  scene.add(pointLight2);

  // Create Molecule Group
  moleculeGroup = new THREE.Group();
  scene.add(moleculeGroup);
  createMolecule();

  // Create Particles
  createParticles();

  window.addEventListener('resize', onWindowResize, false);
  animate3D();
}

function createMolecule() {
  // Clear previous
  while(moleculeGroup.children.length > 0) moleculeGroup.remove(moleculeGroup.children[0]);

  if (current3DTheme === 'molecule') {
    const sphereGeo = new THREE.IcosahedronGeometry(2, 1);
    const bondGeo = new THREE.CylinderGeometry(0.2, 0.2, 1, 8);
    
    const nodes = [
      new THREE.Vector3(0, 5, 0),
      new THREE.Vector3(4, 2, 3),
      new THREE.Vector3(-4, 2, 3),
      new THREE.Vector3(3, -3, -2),
      new THREE.Vector3(-3, -3, -2),
      new THREE.Vector3(0, 0, 5)
    ];

    const nodeMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.5, metalness: 0.8, roughness: 0.2 });
    const bondMat = new THREE.MeshStandardMaterial({ color: 0x7000ff, emissive: 0x7000ff, emissiveIntensity: 0.3, transparent: true, opacity: 0.6 });

    nodes.forEach(v => {
      const s = new THREE.Mesh(sphereGeo, nodeMat);
      s.position.copy(v);
      moleculeGroup.add(s);
    });

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        if (Math.random() > 0.5) {
          const dir = new THREE.Vector3().subVectors(nodes[j], nodes[i]);
          const len = dir.length();
          const bond = new THREE.Mesh(bondGeo, bondMat);
          bond.position.copy(nodes[i]).add(dir.multiplyScalar(0.5));
          bond.scale.y = len;
          bond.lookAt(nodes[j]);
          bond.rotateX(Math.PI / 2);
          moleculeGroup.add(bond);
        }
      }
    }
  } else if (current3DTheme === 'pillars') {
    const tubeGeo = new THREE.CylinderGeometry(1.5, 1.5, 10, 32, 1, true);
    const tubeMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.2, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
    for(let i=0; i<3; i++) {
      const tube = new THREE.Mesh(tubeGeo, tubeMat);
      tube.position.x = (i - 1) * 6;
      moleculeGroup.add(tube);
    }
  } else if (current3DTheme === 'pipeline') {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-15, 0, 0),
      new THREE.Vector3(-5, 5, -5),
      new THREE.Vector3(5, -5, 5),
      new THREE.Vector3(15, 0, 0)
    ]);
    const pipeGeo = new THREE.TubeGeometry(curve, 64, 0.5, 8, false);
    const pipeMat = new THREE.MeshStandardMaterial({ color: 0x7000ff, emissive: 0x7000ff, emissiveIntensity: 0.4, metalness: 0.8, roughness: 0.2 });
    const pipe = new THREE.Mesh(pipeGeo, pipeMat);
    moleculeGroup.add(pipe);
  } else if (current3DTheme === 'network') {
    const nodeMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 0.6 });
    const bondMat = new THREE.MeshBasicMaterial({ color: 0x7000ff, transparent: true, opacity: 0.3 });
    for(let i=0; i<15; i++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), nodeMat);
      s.position.set((Math.random()-0.5)*20, (Math.random()-0.5)*15, (Math.random()-0.5)*10);
      moleculeGroup.add(s);
    }
  }
}

function createParticles() {
  const particleCount = 2000;
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  for(let i=0; i<particleCount*3; i+=3) {
    positions[i] = (Math.random()-0.5) * 100;
    positions[i+1] = (Math.random()-0.5) * 60;
    positions[i+2] = (Math.random()-0.5) * 50;

    const color = new THREE.Color(Math.random() > 0.5 ? 0x00d4ff : 0x7000ff);
    colors[i] = color.r; colors[i+1] = color.g; colors[i+2] = color.b;
  }

  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const particleMat = new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.6 });
  particleSystem = new THREE.Points(particleGeo, particleMat);
  scene.add(particleSystem);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate3D() {
  requestAnimationFrame(animate3D);
  if (moleculeGroup) {
    moleculeGroup.rotation.y += 0.002;
    moleculeGroup.rotation.x += 0.001;
  }
  if (particleSystem) {
    particleSystem.rotation.y += 0.0005;
  }
  renderer.render(scene, camera);
}

let isPlaying = false;
let isMuted = false;
let currentUtterance = null;
let segmentTimeout = null;
let isTransitioning = false;

function stripHTML(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}
function estimateDuration(text) {
  const words = text.split(/\s+/).length;
  return (words / 2.6) * 1000;
}

function renderSlide(index) {
  const s = slides[index];
  const num = String(index + 1).padStart(2, '0');
  slideNum.textContent = num;
  let html = '';

  // Update 3D Background Theme
  if (current3DTheme !== s.theme) {
    current3DTheme = s.theme;
    createMolecule();
  }

  if (s.type === 'title' || s.type === 'closing') {
    html = `<div class="slide-label"><span class="line"></span>${s.label}<span class="line"></span></div>`;
    html += `<h2 class="slide-title">${s.title}</h2>`;
    if (s.subtitle) html += `<div class="slide-subtitle">${s.subtitle}</div>`;
    if (s.brand) html += `<div class="slide-brand">${s.brand}</div>`;
    slideContent.className = 'slide-content ' + (s.type === 'title' ? 'title-slide' : 'closing-slide');
  } else if (s.type === 'bento') {
    html = `<div class="slide-label"><span class="line"></span>${s.label}</div>`;
    html += `<h2 class="slide-title">${s.title}</h2>`;
    html += `<div class="bento-grid">`;
    s.cards.forEach((c, i) => {
      html += `<div class="bento-card ${c.large ? 'large' : ''}" data-idx="${i}">
        <div class="sc-icon"><i class="fas ${c.icon}"></i></div>
        <div class="sc-text">${c.text}</div>
      </div>`;
    });
    html += `</div>`;
    slideContent.className = 'slide-content';
  } else if (s.type === 'split') {
    html = `<div class="split-layout">`;

               <div class="slide-label"><span class="line"></span>${s.label}</div>
               <h2 class="slide-title">${s.title}</h2>
             </div>`;
    // Empty visual container, 3D is handled by background, but we show a HUD frame
    html += `<div class="split-visual"><div class="visual-container"><div class="br-bl"></div><div class="br-br"></div></div></div>`;
    html += `</div>`;
    html += `<div class="split-bullets" style="margin-top: 30px; max-width: 600px;">`;
    s.segments.forEach((seg, i) => {
      html += `<div class="bullet" data-idx="${i}"><div class="bullet-icon"><i class="fas fa-chevron-right"></i></div><div class="bullet-text">${seg}</div></div>`;
    });
    html += `</div>`;
    slideContent.className = 'slide-content';
  } else {
    html = `<div class="slide-label"><span class="line"></span>${s.label}</div>`;
    html += `<h2 class="slide-title">${s.title}</h2>`;

      html += `<div class="bullet" data-idx="${i}"><div class="bullet-icon"><i class="fas fa-chevron-right"></i></div><div class="bullet-text">${seg}</div></div>`;
    });
    slideContent.className = 'slide-content';
  }
  slideContent.innerHTML = html;
}

function animateSlideIn(index) {
  const s = slides[index];
  slideNum.classList.remove('fade-out');
  
  // GSAP Animation Orchestrations
  gsap.killTweensOf(".slide-label, .slide-title, .bullet, .bento-card, .split-visual, .slide-subtitle, .slide-brand");
  
  gsap.set([".slide-label", ".slide-title", ".bullet", ".bento-card", ".split-visual", ".slide-subtitle", ".slide-brand"], { opacity: 0, y: 20, filter: "blur(10px)" });
  
  gsap.to(".slide-label", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", delay: 0.1 });
  gsap.to(".slide-title", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out", delay: 0.2 });
  
  if (s.type === 'split') {
    gsap.to(".split-visual", { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1, ease: "power3.out", delay: 0.4 });
  }
  if (s.type === 'title' || s.type === 'closing') {
    gsap.to(".slide-subtitle", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", delay: 0.5 });
    gsap.to(".slide-brand", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", delay: 0.7 });
  }
}

function showSegment(index) {
  const s = slides[currentSlide];
  if (s.type === 'title' || s.type === 'closing') return;
  
  if (s.type === 'bento') {
    const cards = slideContent.querySelectorAll('.bento-card');
    if (cards[index]) {
      gsap.to(cards[index], { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" });
    }
  } else {
    const bullets = slideContent.querySelectorAll('.bullet');
    if (bullets[index]) {
      gsap.to(bullets[index], { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" });
    }
  }
}

function speakSegment(text) {
  const plain = stripHTML(text);
  return window.presentationVoice.speak(plain, {
    muted: isMuted,
    fallbackDuration: estimateDuration(plain),
    onUtterance: u => { currentUtterance = u; }
  }).then(() => { currentUtterance = null; });
}

async function playCurrentSlide() {
  const myToken = ++genToken; 
  if (!isPlaying) return;
  const s = slides[currentSlide];
  animateSlideIn(currentSlide);
  const introDelay = (s.type === 'title' || s.type === 'closing') ? 1200 : 800;
  await delay(introDelay);
  if (!isPlaying || myToken !== genToken) return;
  const segs = s.segments || [];
  for (let i = 0; i < segs.length; i++) {
    if (!isPlaying || myToken !== genToken) return;
    showSegment(i);
    await speakSegment(segs[i]);
    if (!isPlaying || myToken !== genToken) return;
    await delay(350);
  }
  if (!isPlaying || myToken !== genToken) return;
  await delay(1200);
  if (!isPlaying || myToken !== genToken) return;
  goToSection(currentSection + 1);
}

function stopSpeech() {
  genToken++;
  clearTimeout(segmentTimeout);
  synth.cancel();
  currentUtterance = null;
}
function delay(ms) { return new Promise(r => { segmentTimeout = setTimeout(r, ms); }); }
function updatePlayBtn() {
  btnPlay.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
  if (isPlaying) { audioWave.classList.remove('paused'); btnPlay.classList.add('active'); }
  else { audioWave.classList.add('paused'); btnPlay.classList.remove('active'); }
}

function updateProgressForSection(index, subProgress) {
  subProgress = subProgress || 0;
  const pct = (index + Math.min(1, Math.max(0, subProgress))) / totalSections;
  progressFill.style.width = (Math.min(1, pct) * 100) + '%';
  counterCurrent.textContent = String(index + 1).padStart(2, '0');
}

function hideAllSectionViews() {
  introVideoEl.pause();
  outroVideoEl.pause();
  introVideoEl.style.display = 'none';
  outroVideoEl.style.display = 'none';
  document.getElementById('presentation').classList.remove('active');
}

function enterIntroSection() {
  introVideoEl.style.display = 'block';
  introVideoEl.currentTime = 0;
  updateProgressForSection(0, 0);
  if (isPlaying) {
    const p = introVideoEl.play();
    if (p && p.catch) p.catch(() => {});
  }
}
function enterOutroSection() {
  outroVideoEl.style.display = 'block';
  outroVideoEl.currentTime = 0;
  updateProgressForSection(totalSections - 1, 0);
  if (isPlaying) {
    const p = outroVideoEl.play();
    if (p && p.catch) p.catch(() => {});
  }
}
function enterSlideSection() {
  document.getElementById('presentation').classList.add('active');
  renderSlide(currentSlide);
  updateProgressForSection(currentSlide + 1, 0);
  if (isPlaying) {
    playCurrentSlide();
  } else {
    animateSlideIn(currentSlide);
    const s = slides[currentSlide];
    if (s.type === 'bento') {
      slideContent.querySelectorAll('.bento-card').forEach((c, i) => {
        setTimeout(() => showSegment(i), 300 + i * 150);
      });
    } else if (s.type !== 'title' && s.type !== 'closing') {
      slideContent.querySelectorAll('.bullet').forEach((b, i) => {
        setTimeout(() => showSegment(i), 300 + i * 150);
      });
    }
  }
}

function goToSection(index, opts) {
  opts = opts || {};
  if (isTransitioning) return;
  index = Math.max(0, Math.min(totalSections - 1, index));
  isTransitioning = true;
  stopSpeech();
  const delayMs = opts.instant ? 0 : 350;
  if (!opts.instant) {
    slideNum.classList.add('fade-out');
    transOverlay.classList.add('active');
  }
  setTimeout(() => {
    currentSection = index;
    recordSectionReached(index);
    hideAllSectionViews();
    transOverlay.classList.remove('active');
    isTransitioning = false;
    if (index === 0) {
      enterIntroSection();
    } else if (index === totalSections - 1) {
      enterOutroSection();
    } else {
      currentSlide = index - 1;
      enterSlideSection();
    }
  }, delayMs);
}

function finishPresentation() {
  window.parent && window.parent.postMessage({ type: 'presentation-complete', module: 'module1' }, '*');
}

introVideoEl.addEventListener('ended', () => { if (currentSection === 0) goToSection(1); });
outroVideoEl.addEventListener('ended', () => { if (currentSection === totalSections - 1) finishPresentation(); });
introVideoEl.addEventListener('timeupdate', () => {
  if (currentSection === 0 && introVideoEl.duration) updateProgressForSection(0, introVideoEl.currentTime / introVideoEl.duration);
});
outroVideoEl.addEventListener('timeupdate', () => {
  if (currentSection === totalSections - 1 && outroVideoEl.duration) updateProgressForSection(totalSections - 1, outroVideoEl.currentTime / outroVideoEl.duration);
});

function togglePlay() {
  if (currentSection === 0 || currentSection === totalSections - 1) {
    const vid = currentSection === 0 ? introVideoEl : outroVideoEl;
    if (vid.paused) {
      const p = vid.play();
      if (p && p.catch) p.catch(() => {});
      isPlaying = true;
    } else {
      vid.pause();
      isPlaying = false;
    }
    updatePlayBtn();
  } else {
    if (isPlaying) { isPlaying = false; stopSpeech(); updatePlayBtn(); }
    else { isPlaying = true; updatePlayBtn(); playCurrentSlide(); }
  }
}

  isMuted = !isMuted;
  btnMute.innerHTML = isMuted ? '<i class="fas fa-volume-xmark"></i>' : '<i class="fas fa-volume-high"></i>';

btnMute.addEventListener('click', toggleMute);
btnPrev.addEventListener('click', () => goToSection(currentSection - 1));
btnNext.addEventListener('click', () => {
  const nextIndex = currentSection + 1;
  if (nextIndex > maxSectionReached) {
    showSeekBlockedHint();
  } else {
    goToSection(nextIndex);
  }
});
btnRestart.addEventListener('click', () => { isPlaying = false; updatePlayBtn(); goToSection(0); });
document.addEventListener('keydown', e => {
  if (document.getElementById('startScreen').style.display !== 'none' && !document.getElementById('startScreen').classList.contains('hidden')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') {
    e.preventDefault();
    const nextIndex = currentSection + 1;
    if (nextIndex > maxSectionReached) {
      showSeekBlockedHint();
    } else {
      goToSection(nextIndex);
    }
  }
  if (e.code === 'ArrowLeft') { e.preventDefault(); goToSection(currentSection - 1); }
  if (e.code === 'KeyM') { e.preventDefault(); toggleMute(); }
  if (e.code === 'KeyF') { e.preventDefault(); toggleFullscreen(); }
  if (e.code === 'KeyR') { e.preventDefault(); isPlaying = false; updatePlayBtn(); goToSection(0); }
});

const progressTrackEl = document.getElementById('progressTrack');
let isScrubbing = false;
function pctFromPointer(clientX) {
  const rect = progressTrackEl.getBoundingClientRect();
  let pct = (clientX - rect.left) / rect.width;
  return Math.min(1, Math.max(0, pct));
}
function previewAt(pct) {
  const rawTarget = Math.round(pct * (totalSections - 1));
  const target = Math.min(rawTarget, maxSectionReached);
  const clampedPct = (totalSections - 1) > 0 ? target / (totalSections - 1) : 0;
  progressFill.style.width = (clampedPct * 100) + '%';
  counterCurrent.textContent = String(target + 1).padStart(2, '0');
  if (rawTarget > maxSectionReached) showSeekBlockedHint();
}
function commitScrub(clientX) {
  const pct = pctFromPointer(clientX);
  const rawTarget = Math.round(pct * (totalSections - 1));
  const target = Math.min(rawTarget, maxSectionReached);
  if (rawTarget > maxSectionReached) showSeekBlockedHint();
  goToSection(target, { instant: true });
}
progressTrackEl.addEventListener('mousedown', e => { isScrubbing = true; progressFill.classList.add('scrubbing'); previewAt(pctFromPointer(e.clientX)); });
window.addEventListener('mousemove', e => { if (isScrubbing) previewAt(pctFromPointer(e.clientX)); });
window.addEventListener('mouseup', e => { if (!isScrubbing) return; isScrubbing = false; progressFill.classList.remove('scrubbing'); commitScrub(e.clientX); });
progressTrackEl.addEventListener('click', e => { if (isScrubbing) return; commitScrub(e.clientX); });
progressTrackEl.addEventListener('touchstart', e => { isScrubbing = true; progressFill.classList.add('scrubbing'); previewAt(pctFromPointer(e.touches[0].clientX)); }, { passive: true });
progressTrackEl.addEventListener('touchmove', e => { if (isScrubbing) previewAt(pctFromPointer(e.touches[0].clientX)); }, { passive: true });
progressTrackEl.addEventListener('touchend', e => { if (!isScrubbing) return; isScrubbing = false; progressFill.classList.remove('scrubbing'); commitScrub(e.changedTouches[0].clientX); });

function pauseForBackground() {
  if (isPlaying) {
    if (currentSection === 0 || currentSection === totalSections - 1) {
      const vid = currentSection === 0 ? introVideoEl : outroVideoEl;
      try { vid.pause(); } catch (e) {}
    } else {
      stopSpeech();
    }
    isPlaying = false;
    updatePlayBtn();
  }
  try { synth.cancel(); } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) pauseForBackground();
});
window.addEventListener('pagehide', pauseForBackground);
window.addEventListener('beforeunload', () => { synth.cancel(); });

window.addEventListener('message', event => {
  if (!event.data || !event.data.type) return;
  if (event.data.type === 'pause-presentation') { pauseForBackground(); return; }
  if (event.data.type === 'resume-presentation') { if (!isPlaying) togglePlay(); return; }
  if (event.data.type === 'restart-presentation') { isPlaying = false; updatePlayBtn(); goToSection(0); return; }
  if (event.data.type === 'toggle-mute-presentation') { toggleMute(); return; }
});

// Initialize WebGL Scene
initThreeJS();
</script>
</body>
</html>
